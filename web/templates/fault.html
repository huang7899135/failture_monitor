<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故障通知单</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/weui.min.css') }}">

    <style>
        .responsive-image {
            max-width: 100%; /* 使图片的最大宽度为其容器的宽度 */
            height: auto; /* 保持图片的原始纵横比 */
            display: block; /* 避免行内元素的默认间距 */
            margin: 0 auto; /* 使图片在容器中居中 */
        }

        #fault-info {
            margin: 40px 40px;
            padding: 20px 20px;
            background-color: #f3f1f1;
            /*background-color: #F8F6F6FF;*/
        }

        #fault-title {
            text-align: center;
        }

        .weui-tabbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000; /* 确保在其他内容之上 */
        }

        .page__bd {
            padding-bottom: 50px; /* 为tabbar留出空间，避免内容被遮挡 */
        }

        .weui-btn-area {
            margin-top: 8px;
        }

        .weui-media-box {
            overflow: visible;
            white-space: normal;
        }
    </style>
</head>
<body data-weui-theme="light">
<div class="page">
    <div class="page__bd" style="height: 100%;">
        <div class="weui-tab">
            <!-- 消息页面 -->
            <div id="panel1" role="tabpanel" aria-labelledby="tab1" class="weui-tab__panel">
                <div class="weui-panel weui-panel_access" id="fault-info">
                    <div class="weui-panel__hd" id="fault-title">设备故障</div>
                    <div class="weui-panel__bd">
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">设备名称</strong>
                            <p class="weui-media-box__desc">
                                {{device_name}}
                            </p>
                        </div>
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">ip地址</strong>
                            <p class="weui-media-box__desc">
                                {{ip}}
                            </p>
                        </div>
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">port</strong>
                            <p class="weui-media-box__desc">
                                {{port}}
                            </p>
                        </div>
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">地址</strong>
                            <p class="weui-media-box__desc">
                                {{location}}
                            </p>
                        </div>
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">故障时间</strong>
                            <p class="weui-media-box__desc">
                                {{fault_time}}
                            </p>
                        </div>
                        {% if processors %}
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">故障处理人</strong>
                            <p class="weui-media-box__desc">
                                {{ processors }}
                            </p>
                        </div>
                        {% endif %}
                        <div role="option" class="weui-media-box weui-media-box_text">
                            <strong class="weui-media-box__title">内容</strong>
                            <p class="">
                                {{remark}}
                            </p>
                        </div>
                    </div>

                </div>
                <div class="weui-panel__bd">
                    <div class="weui-media-box weui-media-box_text">
                        <div class="weui-btn-area">
                            <button class="weui-btn weui-btn_primary" id="accept_ticket">接收工单</button>
                            <button class="weui-btn weui-btn_warn" id="showActionSheet">稍后通知</button>
                            <button class="weui-btn weui-btn_default">故障恢复</button>
                        </div>

                    </div>
                </div>
            </div>
            <!-- 我的页面 -->
            <div id="panel2" role="tabpanel" aria-labelledby="tab2" class="weui-tab__panel" style="display: none;">
                <!--                <div class="weui-panel__hd">我的</div>-->
                <div class="weui-panel__bd">
                    <!-- 这里可以添加用户的信息内容 -->
                    <img src="{{ url_for('static', filename='img/test.jpg') }}" alt="Description of Image"
                         class="responsive-image">

                </div>
            </div>

            <!-- Tab栏 -->
            <div role="tablist" aria-label="选项卡标题" class="weui-tabbar">
                <div id="tab1" role="tab" aria-selected="true" aria-controls="panel1"
                     class="weui-tabbar__item weui-bar__item_on">

                                  fill="#1AB58F" p-id="3905"></path>
                        </svg>

                    </div>
                    <!--                    <p class="weui-tabbar__label">消息</p>-->
                </div>
                <div id="tab2" role="tab" aria-selected="false" aria-controls="panel2" class="weui-tabbar__item">
                    <div class="weui-tabbar__icon">

                    </div>
                    <!--                    <p class="weui-tabbar__label">我的</p>-->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ActionSheet -->
<div id="actionSheet_wrap">
    <div class="weui-mask" id="mask" style="display: none;"></div>
    <div class="weui-actionsheet" id="weui_actionsheet">
        <div class="weui-actionsheet__menu">
            <div class="weui-actionsheet__cell" id="send-in-hour">1个小时</div>
            <div class="weui-actionsheet__cell" id="no-send-today">今日内不再发送</div>
            <div class="weui-actionsheet__cell" id="never-send">停止发送</div>
            <div class="weui-actionsheet__cell" id="showDatePicker">手动选择发送时间</div>
        </div>
        <div class="weui-actionsheet__action">
            <div class="weui-actionsheet__cell" id="actionsheet_cancel">取消</div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/weui.min.css') }}"></script>
<script>
    // 切换Tab的功能
    $('.weui-tabbar__item').on('click', function () {
        $(this).attr('aria-selected', 'true').addClass('weui-bar__item_on');
        $(this).siblings('.weui-bar__item_on').removeClass('weui-bar__item_on').attr('aria-selected', 'false');
        var panelId = '#' + $(this).attr('aria-controls');
        $(panelId).show();
        $(panelId).siblings('.weui-tab__panel').hide();
    });

    // 显示ActionSheet的功能
    $('#showActionSheet').on('click', function () {
        $('#mask').fadeIn(200);
        $('#weui_actionsheet').addClass('weui-actionsheet_toggle');
    });

    // 隐藏ActionSheet的功能
    $('#actionsheet_cancel, #mask').on('click', function () {
        $('#mask').fadeOut(200);
        $('#weui_actionsheet').removeClass('weui-actionsheet_toggle');
    });

    // 显示日期选择器的功能
    $('#showDatePicker').on('click', function () {
        weui.datePicker({
            start: new Date(),
            end: new Date().getFullYear() + 10,
            onChange: function (result) {
                console.log(result);
                // 这里可以处理选择的日期结果
            }
        });
        $('#mask').fadeOut(200);
        $('#weui_actionsheet').removeClass('weui-actionsheet_toggle');

    });

    // 接收工单的功能,获取url中的参数,转换成data{user_id: xxx, ticket_id: xxx},post给后端
    $('#accept_ticket').on('click', function () {
        let url = window.location.href;
        let params = url.split('?')[1].split('&');
        let data = {};
        for (let i = 0; i < params.length; i++) {
            let param = params[i].split('=');
            data[param[0]] = param[1];
        }
        $.ajax({
            url: '/device_failure',
            type: 'POST',
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function (res) {
                if (res.code === 0) {
                    weui.toast('接单成功', 1000);
                    setTimeout(function () {
                        //     刷新本页
                        window.location.reload();
                    }, 1000);
                } else {
                    weui.alert(res.msg);
                }
            }
        });
    });

    function sent_next_time(time) {
        let url = window.location.href;
        let params = url.split('?')[1].split('&');
        let data = {};
        for (let i = 0; i < params.length; i++) {
            let param = params[i].split('=');
            data[param[0]] = param[1];
        }
        data['next_notify_time'] = time;
        $.ajax({
            url: '/user_notify_frequency',
            type: 'POST',
            data: JSON.stringify(data),
            contentType: 'application/json',
            success: function (res) {
                if (res.code === 0) {
                    weui.toast('设置成功', 1000);
                    setTimeout(function () {
                        //     刷新本页
                        window.location.reload();
                    }, 1000);
                } else {
                    weui.alert(res.msg);
                }
            }
        });
    }

    //     处理稍后通知的功能,获取当前的datetime,在根据用户选择的内容
    //     1小时后,就是当前时间加上1个小时,生成next_notify_time,post给后端
    //     今日内不再发送,就返回明日的0点,生成next_notify_time,post给后端
    //     停止发送,就返回一个很大的时间,生成next_notify_time,post给后端
    //     手动选择发送时间,就弹出日期选择器,生成next_notify_time,post给后端
    $('#send-in-hour').on('click', function () {
        let now = new Date();
        console.log(now)
        let next_time = new Date(now.getTime() + 60 * 60 * 1000);
        sent_next_time(next_time);
    });
    $('#no-send-today').on('click', function () {
        let now = new Date();
        let next_time = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        sent_next_time(next_time);
    });
    $('#never-send').on('click', function () {
        let next_time = new Date(9999, 12, 31);
        sent_next_time(next_time);
    });
</script>
</body>
</html>
