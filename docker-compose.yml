version: '3.8'

services:
  app:
    build: .
    ports:
      - "8090:8090"
    volumes:
      - .:/app
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - FLASK_APP=web_app.py
      - FLASK_ENV=development # Ensures Flask runs in development mode for debugging
      - APP_ENV=dev # To match the setting in config/setting.py
    depends_on:
      - db
      - redis
    command: flask run --host=0.0.0.0 --port=8090

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: xs123456
      MYSQL_DATABASE: failure_monitor
      # MYSQL_USER: root # Already default user with MYSQL_ROOT_PASSWORD
      # MYSQL_PASSWORD: xs123456 # Covered by MYSQL_ROOT_PASSWORD
    ports:
      - "3306:3306" # Expose MySQL port to host for direct access if needed
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-P", "3306", "-u", "root", "--password=xs123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379" # Expose Redis port to host for direct access if needed
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    volumes:
      - .:/app
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - APP_ENV=dev # To match the setting in config/setting.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app: # Celery might need app code to be ready, though not strictly a startup dependency
        condition: service_started
    command: celery -A tasks.monitor_tasks.app worker -l info -B # -B runs beat scheduler in the same process

volumes:
  mysql_data:
  redis_data:
