version: '3.8'

services:
  app:
    build: .
    ports:
      - "8090:8090"  # 只暴露应用端口供外部访问
    volumes:
      - .:/app
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - FLASK_APP=web_app.py
      - FLASK_ENV=development # Ensures Flask runs in development mode for debugging
      - APP_ENV=dev # To match the setting in config/setting.py
    depends_on:
      - db
      - redis
    command: flask run --host=0.0.0.0 --port=8090
    networks:
      - internal_network

  db:
    image: dockerpull.cn/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: xs123456
      MYSQL_DATABASE: failure_monitor
      # MYSQL_USER: root # Already default user with MYSQL_ROOT_PASSWORD
      # MYSQL_PASSWORD: xs123456 # Covered by MYSQL_ROOT_PASSWORD
    # 移除端口暴露，只在Docker内部网络中访问
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-P", "3306", "-u", "root", "--password=xs123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: dockerpull.cn/redis:alpine
    # 移除端口暴露，只在Docker内部网络中访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  celery:
    build: .
    volumes:
      - .:/app
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - APP_ENV=dev # To match the setting in config/setting.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app: # Celery might need app code to be ready, though not strictly a startup dependency
        condition: service_started
    command: celery -A tasks.monitor_tasks.app worker -l info -B # -B runs beat scheduler in the same process
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
    internal: false  # 允许容器访问外部网络（如果需要访问外部API）

volumes:
  mysql_data:
  redis_data:
