services:
  app:
    build: .
    ports:
      - "8090:8090"  # 只暴露应用端口供外部访问
    volumes:
      - .:/app
      - app_logs:/app/log  # 生产环境日志持久化
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - FLASK_APP=web_app.py
      - FLASK_ENV=production # 生产环境模式
      - APP_ENV=prod # 生产环境配置
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn --bind 0.0.0.0:8090 --workers 4 --timeout 120 --keep-alive 2 --max-requests 1000 --max-requests-jitter 50 web_app:app
    networks:
      - internal_network

  db:
    image: dockerpull.cn/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: xs123456
      MYSQL_DATABASE: failure_monitor
      # MYSQL_USER: root # Already default user with MYSQL_ROOT_PASSWORD
      # MYSQL_PASSWORD: xs123456 # Covered by MYSQL_ROOT_PASSWORD
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 移除端口暴露，只在Docker内部网络中访问
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=xs123456"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - internal_network

  redis:
    image: dockerpull.cn/redis:alpine
    # 移除端口暴露，只在Docker内部网络中访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network

  celery:
    build: .
    volumes:
      - .:/app
      - app_logs:/app/log  # 生产环境日志持久化
    environment:
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - APP_ENV=prod # 生产环境配置
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app: # Celery might need app code to be ready, though not strictly a startup dependency
        condition: service_started
    command: celery -A tasks.monitor_tasks.app worker -l warning -B --concurrency=2 # 生产环境降低日志级别并限制并发数
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
    internal: false  # 允许容器访问外部网络（如果需要访问外部API）

volumes:
  mysql_data:
  redis_data:
  app_logs:
